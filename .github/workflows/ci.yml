# ────────────────────────────────────────────────────────────────────────
# Continuous integration for the ezal project.
#
# CI builds and tests on every push and pull request. It does **not** flash
# real hardware; it only runs anything that can be executed on the CI
# runner's host.
#
# Every job runs inside a Nix dev shell from this repo, so the toolchain is
# the exact one pinned by `flake.lock` — the same `cargo`, `clippy`,
# `picotool`, and `node` a contributor gets locally. The Rust jobs load the
# *lean* `.#ci` shell (Rust toolchain + picotool, no probe-rs/node/python) and
# the dashboard job loads `.#dashboard` (Rust configuration exporter + Node), both via
# `nicknovitski/nix-develop`, which exports the shell's environment to every
# later step, so plain commands and `Swatinem/rust-cache` all see it.
#
# Every check is a script contributors run locally. The four jobs run in
# parallel:
#
#   fmt            — shown as "Format": scripts/lint.sh (formatting, clippy
#                    for both crates, rustdoc) and scripts/test-build-tools.sh
#   test-host      — scripts/test-host.sh: ezal-core's tests on the host
#   test-dashboard — scripts/test-dashboard.sh: the served dashboard JS
#                    under Node's test runner
#   build-firmware — scripts/build-uf2.sh, then uploads the elf and UF2
# ────────────────────────────────────────────────────────────────────────

name: CI

# Builds need repository contents, but never write access to this repository.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# A single workflow run cancels older runs on the same ref so we don't
# pile up CI minutes on rebased branches.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Static checks and build tooling ──────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Load the .#ci dev shell
        # Puts the flake-pinned toolchain on PATH for the steps below.
        uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1
        with:
          arguments: ".#ci"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: ./scripts/lint.sh
      - run: ./scripts/test-build-tools.sh

  # ── Host unit tests ──────────────────────────────────────────────────
  test-host:
    name: Test (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1
        with:
          arguments: ".#ci"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run ezal-core tests
        run: |
          ./scripts/test-host.sh

  # ── Dashboard behaviour tests ────────────────────────────────────────
  test-dashboard:
    name: Test (dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Load the .#dashboard dev shell
        # Export the firmware's client configuration with Rust, then execute
        # the actual served script and configuration in Node.
        uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1
        with:
          arguments: ".#dashboard"
      - run: ./scripts/test-dashboard.sh

  # ── Cross-compile firmware + package UF2 ─────────────────────────────
  build-firmware:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1
        with:
          arguments: ".#ci"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build and package firmware
        # build-uf2.sh prints the paths of the elf and UF2 it built.
        run: |
          set -euo pipefail
          mkdir -p dist
          ./scripts/build-uf2.sh | xargs -d '\n' cp -t dist/ --
      - name: Upload firmware artefacts
        # Lets reviewers download the firmware from a PR run without building
        # it: the elf for a debug probe (probe-rs / SWD), and the UF2 for
        # drag-and-drop BOOTSEL flashing with no extra tooling.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ezal-firmware-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
