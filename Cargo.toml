# ────────────────────────────────────────────────────────────────────────────
# ezal — workspace manifest
# ────────────────────────────────────────────────────────────────────────────
#
# The project is organised as a Cargo *workspace* with two member crates:
#
#   crates/ezal-core
#     Pure, no_std Rust: calibration, tracking simulation, controller,
#     G5500 drive safety, protocol, and command parsers. This crate
#     has no hardware dependencies, so it can be unit-tested on the host with
#     `./scripts/test-host.sh` (the workspace defaults to the embedded target).
#
#   crates/ezal-firmware
#     The embedded application that actually runs on the Raspberry Pi Pico 2
#     (RP2350). It depends on `ezal-core` and on the `embassy-rp` HAL.
#
# Separating "logic" from "firmware" is a long-standing best practice in
# embedded development. Hardware-independent code is easier to reason about,
# easier to test, and easier to refactor; the firmware crate stays a thin
# shell that wires up peripherals and pumps data through the logic.
#
# This file is the single source of truth for:
#   * which crates make up the workspace,
#   * dependency version requirements (under [workspace.dependencies]);
#     Cargo.lock records the exact resolved versions,
#   * shared package metadata (license, edition, MSRV) for both crates,
#   * compiler profiles for debug and release builds.

[workspace]
resolver = "2"
members  = [
    "crates/ezal-core",
    "crates/ezal-firmware",
]
# `default-members` controls which crates are built when you run `cargo build`
# from the workspace root with no `-p <crate>` flag. We deliberately exclude
# `ezal-firmware` because it cannot be built for the host: it is `no_std`,
# `no_main`, and depends on RP2350-specific HALs. To work on firmware, either
# `cd crates/ezal-firmware` or pass `-p ezal-firmware`.
default-members = ["crates/ezal-core"]

# Workspace-wide package metadata. Each member crate inherits these with
# `field.workspace = true` in its own `Cargo.toml`, so we only edit them once.
[workspace.package]
edition      = "2021"
# This is the oldest compiler we support and test, matching rust-toolchain.toml.
rust-version = "1.99"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/tteggel/ezal"
authors      = ["ezal contributors"]

# Centralised dependency versions. Both crates refer to these with
# `<dep>.workspace = true`, which keeps versions in lock-step automatically.
[workspace.dependencies]

# ── shared, no_std friendly ──────────────────────────────────────────────
# `heapless` gives firmware fixed-capacity strings for WebSocket telemetry
# without requiring an allocator.
heapless = { version = "0.9.3", default-features = false }

# ── embedded-only (consumed by ezal-firmware) ────────────────────────────
# These are the standard "embassy + defmt" stack used by the embassy
# upstream examples. See docs/DEVELOPMENT.md for why each one is here.
cortex-m         = "0.7.9"
cortex-m-rt      = "0.7.7"
defmt            = "1.1.1"
defmt-rtt        = "1.3.0"
panic-probe      = { version = "1.0.0", features = ["print-defmt"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures  = "0.1.2"
embassy-rp       = { version = "0.10", features = ["rp235xa", "time-driver", "critical-section-impl", "defmt", "imagedef-secure-exe", "unstable-pac"] }
embassy-time     = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-net      = { version = "0.9.1", features = ["defmt", "dhcpv4", "tcp"] }
embassy-sync     = "0.8"

# ── WiFi: the Pico 2 W's on-module CYW43439 radio ────────────────────────
# `cyw43` is the pure-ish driver for the Infineon CYW43439; `cyw43-pio`
# bit-bangs its gSPI bus on a PIO state machine (the chip has no dedicated
# SPI pins for it). `cyw43-pio` links against `embassy-rp`, so its version
# tracks embassy-rp's — 0.10 here; bump the two together. `static_cell`
# hands out the single `'static` `cyw43::State` the driver's background task
# borrows for the life of the program. `defmt` on both mirrors the rest of
# the stack so join errors and bus traces decode on the probe.
cyw43       = { version = "0.7.0", features = ["defmt"] }
cyw43-pio   = { version = "0.10.0", features = ["defmt"] }
static_cell = "2.1.1"

# ── Embedded web UI ──────────────────────────────────────────────────────
# `picoserve` is a small no_std HTTP/WebSocket server designed for Embassy
# network stacks. It stays in firmware; ezal-core only defines the tiny wire
# protocol and static UI payload, and borrows the same parser in its tests.
# The version lives here alone so both members always exercise one picoserve;
# each adds the features it needs (the firmware's `embassy` runtime cannot be
# built for the host, so ezal-core's dev-dependency omits it).
picoserve = { version = "0.20.1", default-features = false }

# ────────────────────────────────────────────────────────────────────────
# Profiles
# ────────────────────────────────────────────────────────────────────────
#
# Release: aggressively optimised, but with debug symbols kept *in the elf*
# so probe-rs and defmt can decode log frames. The symbols don't end up on
# the flashed image, only the host-side elf.
#
#   opt-level = "s"        → optimise for size; flash is finite.
#   lto = "fat"            → whole-program LTO trims a lot of embassy/core glue.
#   codegen-units = 1      → one code-generation unit per crate for optimisation.
#   debug = 2              → keep DWARF so defmt/probe-rs can decode.
#   overflow-checks = true → integer overflow panics in release too — a
#                            silent wraparound in pointing maths could send
#                            the dish into a hard stop.

[profile.release]
opt-level       = "s"
lto             = "fat"
codegen-units   = 1
debug           = 2
overflow-checks = true

# Dev: still optimised. With opt-level = 0 the binary is several times larger,
# embassy's timing assumptions get fragile, and stack usage balloons. The
# common embedded-rust convention is `opt-level = 1` (or higher) even in dev.
[profile.dev]
opt-level       = 1
debug           = 2
overflow-checks = true
