# ────────────────────────────────────────────────────────────────────────────
# Cargo configuration (workspace-wide)
# ────────────────────────────────────────────────────────────────────────────
#
# Cargo reads this file for every command run inside the workspace. It makes
# the RP2350 the default target, makes `cargo run -p ezal-firmware` flash
# through probe-rs, and passes the linker scripts. docs/DEVELOPMENT.md covers
# the workflow, including BOOTSEL flashing without a probe.

# ── Default build target ─────────────────────────────────────────────────
# The project is primarily embedded, so plain `cargo build` / `cargo run`
# target the chip; scripts/test-host.sh passes `--target <host>` for the host
# tests.
[build]
target = "thumbv8m.main-none-eabihf"

# ── Embedded target settings ─────────────────────────────────────────────
[target.thumbv8m.main-none-eabihf]

# `cargo run` builds the ELF, flashes it over SWD, then streams defmt logs
# over RTT until the chip resets or the command is interrupted.
runner = "probe-rs run --chip RP235x --protocol swd"

# Linker flags. These are passed to the linker via `-C link-arg=`:
#
#   --nmagic    Disables page alignment between sections. Saves around
#               1 KiB of flash on a typical embassy build.
#   -Tlink.x    Use the linker script provided by cortex-m-rt. It in turn
#               `INCLUDE`s our `memory.x` to lay out RAM and FLASH.
#   -Tdefmt.x   Use defmt's linker script: log strings get stored in a
#               special section of the elf (".defmt") that the host-side
#               decoder reads to format messages. The strings never go to
#               the chip, only their integer indices do.
#
# Codegen flags:
#   target-cpu=cortex-m33   Tells LLVM the exact micro-arch, which enables
#                           DSP/FPU instructions and better scheduling.
rustflags = [
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tdefmt.x",
    "-C", "target-cpu=cortex-m33",
]

# ── Environment ──────────────────────────────────────────────────────────
# Default defmt log level; a per-module filter overrides it, for example
#     DEFMT_LOG=ezal_firmware=trace,info cargo run -p ezal-firmware
[env]
DEFMT_LOG = "info"
