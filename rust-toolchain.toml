# ────────────────────────────────────────────────────────────────────────────
# Pinned Rust toolchain
# ────────────────────────────────────────────────────────────────────────────
#
# rustup and the flake's dev shells both read this file, so local builds and
# CI use one compiler, standard library and lint set. The stable channel
# suffices: Embassy and the rp235x stack need no nightly.

[toolchain]
# 1.99.0 is the project's tested toolchain. The workspace uses edition 2021;
# dependencies may use newer editions. Update the pin together with CI checks.
channel    = "1.99.0"
components = ["rustfmt", "clippy", "rust-src", "llvm-tools"]
targets    = ["thumbv8m.main-none-eabihf"]
profile    = "minimal"

# Why each component:
#   rustfmt      — `cargo fmt` (style consistency, enforced in CI)
#   clippy       — `cargo clippy` (lints, enforced in CI)
#   rust-src     — standard-library source for editor navigation and optional
#                  core/alloc rebuilds; ordinary firmware builds use prebuilt core.
#   llvm-tools   — provides `llvm-objdump`, `llvm-size`, `llvm-objcopy`,
#                  available for binary inspection with cargo-binutils.
#
# Why the target:
#   thumbv8m.main-none-eabihf
#     The RP2350 dual Cortex-M33 cores. `thumbv8m.main` is the M33 ISA;
#     `none` means no operating system; `eabihf` means hard-float ABI,
#     which the M33 supports via its single-precision FPU.
