# rustfmt configuration: the stable defaults plus two shorthand rewrites.
# scripts/lint.sh checks formatting; `cargo fmt --all` applies it.

# Bare `rustfmt`, as editor integrations run it, ignores Cargo.toml and parses
# as edition 2015 without this, rejecting `async fn`.
edition                  = "2021"
use_field_init_shorthand = true
use_try_shorthand        = true
