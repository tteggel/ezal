# ────────────────────────────────────────────────────────────────────────────
# ezal-core — pure, no_std logic
# ────────────────────────────────────────────────────────────────────────────
#
# This crate is deliberately hardware-independent. It holds the control,
# prediction and tracking policy, the wire protocol and the dashboard asset;
# the crate doc in src/lib.rs lists its modules. It builds for the embedded
# target (no_std, no allocator) and is tested on the host with
# `./scripts/test-host.sh`. Anything that needs `embassy-rp` or touches a
# peripheral belongs in `ezal-firmware`.

[package]
name        = "ezal-core"
description = "Hardware-independent logic for the ezal antenna-tracker firmware."
version     = "0.1.0"

edition.workspace      = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[dependencies]
sgp4 = { workspace = true }
libm = { workspace = true }
heapless = { workspace = true }

[dev-dependencies]
# Exercise the firmware receive adapter against the same WebSocket parser,
# using an in-memory socket and clock without an embedded runtime. The version
# comes from the workspace, so these tests can never drift onto a different
# picoserve than the firmware ships; only the feature set differs, because the
# firmware's `embassy` runtime cannot be built for the host.
picoserve = { workspace = true, features = ["ws"] }
