# ────────────────────────────────────────────────────────────────────────────
# ezal-core — pure, no_std logic
# ────────────────────────────────────────────────────────────────────────────
#
# This crate is deliberately hardware-independent. It holds calibration,
# pointing units, pass simulation, feedback supervision, actuator interlocks, wire
# protocol, ADC register logic, and the embedded dashboard asset.
#
# Because it has no hardware dependencies, it can be:
#   * compiled for the embedded target (no_std, no allocator),
#   * tested on the host with `./scripts/test-host.sh`,
#   * compiled for fuzzing, miri, or other host-only verification tools.
#
# Anything that needs `embassy-rp`, `embedded-hal`, or talks to actual
# peripherals belongs in `ezal-firmware`, not here.

[package]
name        = "ezal-core"
description = "Hardware-independent logic for the ezal antenna-tracker firmware."
version     = "0.1.0"

# Inherit metadata from the workspace so we keep one source of truth.
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[lib]
# The default `lib` settings are fine. No proc-macro, no special crate-type.

[dependencies]
# None: all logic remains allocator-free and `no_std`.

[dev-dependencies]
# Exercise the firmware receive adapter against the same WebSocket parser,
# using an in-memory socket and clock without an embedded runtime. The version
# comes from the workspace, so these tests can never drift onto a different
# picoserve than the firmware ships; only the feature set differs.
picoserve = { workspace = true, features = ["ws"] }
