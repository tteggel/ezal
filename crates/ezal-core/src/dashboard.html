<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ezal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23172023'/%3E%3Cpath d='M14 38a24 24 0 0 0 34-24A32 32 0 0 0 14 38Z' fill='%23f4f7f8'/%3E%3Cpath d='M18 37a20 20 0 0 0 28-20' fill='none' stroke='%23147a73' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M30 42 22 54h20l-8-12' fill='none' stroke='%23f4f7f8' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='47' cy='15' r='4' fill='%23df5d43'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --bg: #f4f7f8;
  --ink: #172023;
  --muted: #68777c;
  --panel: #ffffff;
  --line: #d9e1e4;
  --teal: #147a73;
  --teal-dark: #0f5f59;
  --coral: #df5d43;
  --gold: #b88918;
  --shadow: 0 18px 48px rgba(23, 32, 35, 0.14);
}
* { box-sizing: border-box; }
html { min-height: 100%; background: var(--bg); }
body {
  min-height: 100vh;
  margin: 0;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.74), rgba(244,247,248,0.8)),
    var(--bg);
}
main {
  width: min(100%, 720px);
  min-height: 100vh;
  margin: 0 auto;
  padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  display: grid;
  grid-template-rows: auto auto auto 1fr;
  gap: 16px;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.top-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
}
.brand {
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: 0;
  text-transform: uppercase;
}
.status {
  display: inline-flex;
  align-items: center;
  min-height: 32px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel);
  color: var(--muted);
  font-size: 0.88rem;
  font-weight: 700;
}
.take {
  min-height: 32px;
  padding: 0 12px;
  border: 1px solid #1d272b;
  border-radius: 999px;
  background: #1d272b;
  color: #fff;
  font-size: 0.82rem;
  font-weight: 800;
  text-transform: uppercase;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.take:disabled {
  border-color: var(--line);
  background: var(--panel);
  color: var(--muted);
}
.take:not(:disabled):active {
  background: var(--teal-dark);
}
.status::before {
  content: "";
  width: 8px;
  height: 8px;
  margin-right: 8px;
  border-radius: 50%;
  background: var(--coral);
}
.status.online::before { background: var(--teal); }
.tracker {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 1px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--line);
  box-shadow: 0 8px 28px rgba(23, 32, 35, 0.08);
}
.tracker-item {
  min-width: 0;
  padding: 12px;
  background: var(--panel);
}
.tracker-value {
  display: block;
  overflow: hidden;
  margin-top: 4px;
  font-size: 0.94rem;
  font-weight: 850;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.readouts {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.meter {
  min-width: 0;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  box-shadow: 0 8px 28px rgba(23, 32, 35, 0.08);
}
.label {
  display: block;
  color: var(--muted);
  font-size: 0.82rem;
  font-weight: 800;
  text-transform: uppercase;
}
.value-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-top: 6px;
  white-space: nowrap;
}
.value {
  font-variant-numeric: tabular-nums;
  font-size: 2.15rem;
  line-height: 1;
  font-weight: 850;
}
.unit {
  color: var(--muted);
  font-size: 0.92rem;
  font-weight: 800;
}
.detail {
  display: block;
  margin-top: 10px;
  color: var(--muted);
  font-size: 0.78rem;
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}
.drive-state {
  font-weight: 850;
}
.drive-state.active { color: var(--teal); }
.autonomous .take,
.autonomous .pad-wrap { display: none; }
.pad-wrap {
  align-self: center;
  justify-self: center;
  width: min(100%, 430px);
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  box-shadow: var(--shadow);
}
.pad {
  display: grid;
  grid-template-columns: repeat(3, minmax(72px, 1fr));
  grid-template-rows: repeat(3, minmax(72px, 1fr));
  gap: 10px;
  aspect-ratio: 1;
}
.dir {
  width: 100%;
  height: 100%;
  border: 0;
  border-radius: 8px;
  background: #1d272b;
  color: #fff;
  font-size: 1rem;
  font-weight: 850;
  letter-spacing: 0;
  box-shadow: inset 0 -4px 0 rgba(0,0,0,0.24);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.dir:active:not(.active) {
  background: #1d272b;
  transform: none;
  box-shadow: inset 0 -4px 0 rgba(0,0,0,0.24);
}
.dir.active {
  background: #079e91;
  transform: translateY(2px);
  box-shadow:
    inset 0 -2px 0 rgba(0,0,0,0.34),
    0 0 0 4px rgba(20, 122, 115, 0.36),
    0 13px 30px rgba(20, 122, 115, 0.38);
}
.dir:disabled {
  cursor: default;
  opacity: 0.52;
}
.dir:disabled.active {
  opacity: 1;
}
.dir:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 3px;
}
.up { grid-column: 2; grid-row: 1; }
.left { grid-column: 1; grid-row: 2; }
.right { grid-column: 3; grid-row: 2; }
.down { grid-column: 2; grid-row: 3; }
.center {
  grid-column: 2;
  grid-row: 2;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 800;
  text-transform: uppercase;
}
@media (max-width: 430px) {
  main { gap: 12px; }
  header { align-items: flex-start; }
  .top-actions {
    flex-direction: column-reverse;
    align-items: flex-end;
  }
  .readouts { grid-template-columns: 1fr; }
  .tracker { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .value { font-size: 1.85rem; }
  .pad-wrap { padding: 12px; }
  .pad {
    grid-template-columns: repeat(3, minmax(64px, 1fr));
    grid-template-rows: repeat(3, minmax(64px, 1fr));
    gap: 8px;
  }
}
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">ezal</div>
    <div class="top-actions">
      <button id="take" class="take" type="button" disabled>viewer</button>
      <div id="status" class="status">offline</div>
    </div>
  </header>
  <section class="tracker" aria-label="Autonomous tracking status">
    <div class="tracker-item"><span class="label">Source</span><span id="source" class="tracker-value">waiting</span></div>
    <div class="tracker-item"><span class="label">Run</span><span id="run" class="tracker-value">--</span></div>
    <div class="tracker-item"><span class="label">Phase</span><span id="phase" class="tracker-value">--</span></div>
    <div class="tracker-item"><span class="label">Control</span><span id="health" class="tracker-value">--</span></div>
  </section>
  <section class="readouts" aria-label="Position feedback">
    <div class="meter">
      <span class="label">Azimuth</span>
      <div class="value-row"><span id="azimuth" class="value">--</span><span class="unit">°</span></div>
      <span class="detail">target <span id="target-azimuth">--</span>° · A1 <span id="a1">--</span> mV</span>
      <span class="detail">drive <span id="azimuth-drive" class="drive-state" aria-live="polite">unknown</span></span>
    </div>
    <div class="meter">
      <span class="label">Elevation</span>
      <div class="value-row"><span id="elevation" class="value">--</span><span class="unit">°</span></div>
      <span class="detail">target <span id="target-elevation">--</span>° · A0 <span id="a0">--</span> mV</span>
      <span class="detail">drive <span id="elevation-drive" class="drive-state" aria-live="polite">unknown</span></span>
    </div>
  </section>
  <section class="pad-wrap" aria-label="Direction controls">
    <div class="pad">
      <button class="dir up" data-cmd="up" aria-label="Move up">UP</button>
      <button class="dir left" data-cmd="ccw" aria-label="Move counter-clockwise">CCW</button>
      <div class="center" aria-hidden="true">idle</div>
      <button class="dir right" data-cmd="cw" aria-label="Move clockwise">CW</button>
      <button class="dir down" data-cmd="down" aria-label="Move down">DOWN</button>
    </div>
  </section>
</main>
<script>
(() => {
  // Must stay below COMMAND_TIMEOUT_MS so a held control keeps its firmware lease alive.
  const refreshMs = 150;
  // Matches COMMAND_MAX_AGE_MS. An OPEN TCP socket does not establish a live
  // application return path: only complete firmware telemetry renews this.
  const telemetryTimeoutMs = 1000;
  const status = document.getElementById("status");
  const take = document.getElementById("take");
  const a0 = document.getElementById("a0");
  const a1 = document.getElementById("a1");
  const azimuth = document.getElementById("azimuth");
  const elevation = document.getElementById("elevation");
  const targetAzimuth = document.getElementById("target-azimuth");
  const targetElevation = document.getElementById("target-elevation");
  const source = document.getElementById("source");
  const run = document.getElementById("run");
  const phase = document.getElementById("phase");
  const health = document.getElementById("health");
  const driveIndicators = {
    azimuth: document.getElementById("azimuth-drive"),
    elevation: document.getElementById("elevation-drive")
  };
  const buttons = Array.from(document.querySelectorAll(".dir"));
  const commands = {
    cw: { axis: "azimuth" },
    ccw: { axis: "azimuth" },
    up: { axis: "elevation" },
    down: { axis: "elevation" }
  };
  let ws;
  let retry = 400;
  let controller = false;
  let networkReady = false;
  let motionFault = null;
  let freshnessToken = null;
  let lastTelemetryAt = -Infinity;
  let inputSequence = 0;
  let pendingPosition = null;
  let pendingTracking = null;
  let desired = { azimuth: null, elevation: null };
  let drive = { azimuth: null, elevation: null };
  const pointers = new Map();
  const axisPointers = { azimuth: null, elevation: null };
  let repeat = 0;

  const degrees = (tenths) => tenths === null || tenths === undefined
    ? "--"
    : (tenths / 10).toFixed(1);

  const duration = (milliseconds) => {
    const seconds = Math.max(0, Math.ceil(milliseconds / 1000));
    const minutes = Math.floor(seconds / 60);
    return `${minutes}:${String(seconds % 60).padStart(2, "0")}`;
  };

  const setStatus = (text, online) => {
    status.textContent = text;
    status.classList.toggle("online", online);
  };

  const send = (message) => {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(message);
  };

  const hasDesired = () => desired.azimuth || desired.elevation;
  const telemetryFresh = () => freshnessToken !== null
    && performance.now() - lastTelemetryAt < telemetryTimeoutMs;
  const canControl = () => controller && networkReady && !motionFault
    && telemetryFresh() && !document.hidden;

  const command = () => {
    const parts = [];
    if (desired.azimuth) parts.push(desired.azimuth);
    if (desired.elevation) parts.push(desired.elevation);
    return parts.length ? `drive:${parts.join("+")}` : "stop";
  };

  const syncButtons = () => {
    buttons.forEach((button) => {
      const cmd = button.dataset.cmd;
      const meta = commands[cmd];
      button.disabled = !canControl();
      button.classList.toggle("active", Boolean(telemetryFresh() && meta && drive[meta.axis] === cmd));
    });
  };

  const syncControl = () => {
    take.disabled = !ws || ws.readyState !== WebSocket.OPEN || controller
      || !networkReady || motionFault !== null || !telemetryFresh();
    take.textContent = controller ? "controller" : "take control";
    syncButtons();
  };

  const syncDriveIndicators = (known) => {
    Object.entries(driveIndicators).forEach(([axis, indicator]) => {
      indicator.textContent = known ? (drive[axis] || "idle").toUpperCase() : "unknown";
      indicator.classList.toggle("active", Boolean(known && drive[axis]));
    });
  };

  const syncRepeat = () => {
    if (canControl() && hasDesired() && !repeat) {
      repeat = setInterval(() => sendMovement(false), refreshMs);
    } else if ((!canControl() || !hasDesired()) && repeat) {
      clearInterval(repeat);
      repeat = 0;
    }
  };

  const sendMovement = (pressed) => {
    // Check on the send path as well as the watchdog timer. Browsers may
    // suspend timers; a resumed interval must not renew an abandoned hold.
    if (!telemetryFresh()) {
      expireTelemetry();
      return;
    }
    if (!canControl()) return;
    if (!hasDesired()) {
      send("stop");
      return;
    }
    inputSequence += 1;
    send(`${pressed ? "press" : "hold"}:${freshnessToken}:${inputSequence}:${command()}`);
  };

  const publish = (pressed = false) => {
    syncRepeat();
    sendMovement(pressed);
  };

  const stopAll = () => {
    const wasActive = hasDesired();
    desired.azimuth = null;
    desired.elevation = null;
    pointers.clear();
    axisPointers.azimuth = null;
    axisPointers.elevation = null;
    syncRepeat();
    if (controller && wasActive) send("stop");
  };

  const expireTelemetry = () => {
    stopAll();
    freshnessToken = null;
    drive.azimuth = null;
    drive.elevation = null;
    [a0, a1, azimuth, elevation, targetAzimuth, targetElevation, run, phase]
      .forEach((element) => { element.textContent = "--"; });
    health.textContent = "unknown";
    syncDriveIndicators(false);
    syncControl();
    setStatus("telemetry lost", false);
  };

  const applyControl = (message) => {
    controller = Boolean(message.controller);
    networkReady = message.network_ready === true;
    motionFault = message.motion_fault || null;
    drive.azimuth = message.azimuth || null;
    drive.elevation = message.elevation || null;
    syncDriveIndicators(telemetryFresh());
    if (!controller || !networkReady || motionFault) stopAll();
    if (motionFault) health.textContent = motionFault.replaceAll("_", " ");
    syncRepeat();
    syncControl();
  };

  const start = (button, pointerId) => {
    if (!telemetryFresh()) expireTelemetry();
    if (!canControl()) return false;
    const cmd = button.dataset.cmd;
    const meta = commands[cmd];
    if (!meta || axisPointers[meta.axis] !== null) return false;
    axisPointers[meta.axis] = pointerId;
    pointers.set(pointerId, { axis: meta.axis, cmd });
    desired[meta.axis] = cmd;
    publish(true);
    return true;
  };

  const release = (pointerId) => {
    const claim = pointers.get(pointerId);
    if (!claim) return;
    pointers.delete(pointerId);
    if (axisPointers[claim.axis] === pointerId) axisPointers[claim.axis] = null;
    if (!controller) return;
    if (desired[claim.axis] === claim.cmd) desired[claim.axis] = null;
    publish();
  };

  const applyPosition = (message) => {
    a0.textContent = message.a0_mv;
    a1.textContent = message.a1_mv;
  };

  const applyTracking = (message) => {
    const autonomous = message.mode !== "manual";
    document.body.classList.toggle("autonomous", autonomous);
    source.textContent = `${message.satellite || "manual"} · ${message.mode}`;
    run.textContent = autonomous ? `pass ${message.pass}` : "manual";
    phase.textContent = autonomous
      ? `${message.phase} · ${duration(message.remaining_ms)}`
      : "calibration";
    health.textContent = motionFault ? motionFault.replaceAll("_", " ") : message.control_state;
    azimuth.textContent = degrees(message.azimuth_tenths);
    elevation.textContent = degrees(message.elevation_tenths);
    targetAzimuth.textContent = degrees(message.target_azimuth_tenths);
    targetElevation.textContent = degrees(message.target_elevation_tenths);
  };

  const connect = () => {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.addEventListener("open", () => {
      retry = 400;
      setStatus("waiting for telemetry", false);
      syncControl();
    });
    ws.addEventListener("message", (event) => {
      try {
        const message = JSON.parse(event.data);
        if (message.type === "position") {
          pendingPosition = message;
          if (telemetryFresh()) applyPosition(message);
        } else if (message.type === "control") {
          applyControl(message);
        } else if (message.type === "tracking") {
          pendingTracking = message;
          if (telemetryFresh()) applyTracking(message);
        } else if (message.type === "freshness" && typeof message.token === "string"
          && /^\d+$/.test(message.token)) {
          // Detect a gap even when suspension prevented the watchdog timer
          // from running before this message callback. Never restore intent.
          if (freshnessToken !== null && !telemetryFresh()) expireTelemetry();
          freshnessToken = message.token;
          lastTelemetryAt = performance.now();
          if (pendingPosition) applyPosition(pendingPosition);
          if (pendingTracking) applyTracking(pendingTracking);
          setStatus(networkReady ? "online" : "network unavailable", networkReady);
          syncDriveIndicators(true);
          syncControl();
        } else if (message.type === "input_required") {
          expireTelemetry();
        }
      } catch (_) {}
    });
    ws.addEventListener("close", () => {
      expireTelemetry();
      freshnessToken = null;
      pendingPosition = null;
      pendingTracking = null;
      controller = false;
      networkReady = false;
      drive.azimuth = null;
      drive.elevation = null;
      syncDriveIndicators(false);
      syncControl();
      setStatus("offline", false);
      const wait = retry;
      retry = Math.min(retry * 1.6, 5000);
      setTimeout(connect, wait);
    });
  };

  take.addEventListener("click", () => {
    if (!take.disabled) send("control:take");
  });
  buttons.forEach((button) => {
    button.addEventListener("pointerdown", (event) => {
      // Right/middle clicks and a pen's barrel button are browser actions,
      // not operator holds. Touch contact also uses the primary button (0).
      if (event.button !== 0) return;
      event.preventDefault();
      if (!start(button, event.pointerId)) return;
      button.setPointerCapture(event.pointerId);
    });
    const end = (event) => {
      release(event.pointerId);
    };
    button.addEventListener("pointerup", end);
    button.addEventListener("pointercancel", end);
    button.addEventListener("lostpointercapture", end);
    button.addEventListener("pointermove", (event) => {
      // With multiple mouse buttons held, releasing the primary button fires
      // pointermove; pointerup waits for the last button. Stop at the release
      // that actually ends the operator hold, even if another button remains.
      if ((event.buttons & 1) === 0) release(event.pointerId);
    });
  });
  window.addEventListener("blur", stopAll);
  window.addEventListener("beforeunload", stopAll);
  window.addEventListener("pagehide", stopAll);
  document.addEventListener("visibilitychange", () => {
    // Mobile app switches and page suspension need not deliver beforeunload.
    // Clear the intent as well as sending stop: a resumed interval must never
    // revive a hold whose pointer release happened while the page was hidden.
    // Firmware lease expiry remains the fallback if this stop cannot be sent.
    if (document.hidden) stopAll();
  });
  setInterval(() => {
    if (freshnessToken !== null && !telemetryFresh()) expireTelemetry();
  }, 100);
  syncControl();
  connect();
})();
</script>
</body>
</html>
