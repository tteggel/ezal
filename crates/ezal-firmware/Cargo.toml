# ────────────────────────────────────────────────────────────────────────────
# ezal-firmware — the embedded application
# ────────────────────────────────────────────────────────────────────────────
#
# The `no_std`, `no_main` binary for the Raspberry Pi Pico 2 W (RP2350): the
# Embassy tasks that own the peripherals and run ezal-core's policy.

[package]
name        = "ezal-firmware"
description = "Embedded firmware for the ezal antenna-tracker (Raspberry Pi Pico 2 W / RP2350)."
version     = "0.1.0"

edition.workspace      = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[dependencies]
ezal-core = { path = "../ezal-core" }

# `set-msplim`: Reset loads MSPLIM with `_stack_end`, so a stack overflow faults
# instead of overwriting statics. memory.x defines `_stack_end` and reserves
# the stack above it.
cortex-m-rt      = { workspace = true, features = ["set-msplim"] }
defmt            = { workspace = true }
defmt-rtt        = { workspace = true }
panic-probe      = { workspace = true }
embassy-executor = { workspace = true }
embassy-futures  = { workspace = true }
embassy-net      = { workspace = true }
embassy-rp       = { workspace = true }
embassy-sync     = { workspace = true }
embassy-time     = { workspace = true }
heapless         = { workspace = true }
picoserve        = { workspace = true, features = ["embassy", "ws", "defmt"] }

# WiFi (Pico 2 W CYW43439). See the workspace manifest for why each is here
# and why cyw43-pio's version is kept in lock-step with embassy-rp.
cyw43            = { workspace = true }
cyw43-pio        = { workspace = true }
static_cell      = { workspace = true }
